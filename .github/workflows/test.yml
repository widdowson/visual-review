name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'extension/**'
  pull_request:
    paths-ignore:
      - 'extension/**'

jobs:
  test:
    # Pinned rather than ubuntu-latest: @rules_playwright//:linux_distro
    # defaults to ubuntu24.04 and does not detect the host, so when the
    # latest label moves on, the hermetic Chromium would be built for a
    # distro the runner no longer is. See README.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Run all tests
        run: bazel test //...
