name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'extension/**'
  pull_request:
    paths-ignore:
      - 'extension/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v
