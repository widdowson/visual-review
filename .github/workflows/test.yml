name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'extension/**'
  pull_request:
    paths-ignore:
      - 'extension/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Run all tests
        run: bazel test //...
