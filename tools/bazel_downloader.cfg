# Bazel downloader rewrite rules, wired in from .bazelrc for every command.
#
# aspect_bazel_lib registers a bats toolchain unconditionally from a github.com
# /archive/ tarball. Because it is a *registered* toolchain, toolchain
# resolution touches it while analysing any target, so one 403 on that download
# aborts the analysis of the whole repo — `bazel test //...` included.
#
# That 403 is what a Claude Code cloud session gets: GitHub access there is
# scoped per repository, and github.com serves /archive/ URLs itself rather
# than redirecting to release assets. Nothing on the host shape works, because
# /archive/ is the only URL aspect_bazel_lib offers for this toolchain.
#
# Bazel's own public mirror carries the archive byte-for-byte under the sha256
# aspect_bazel_lib already pins, so Bazel still verifies the bytes and nothing
# is vendored or patched. github.com is kept below as an ordered fallback, so
# the mirror does not become a new single point of failure; where the mirror
# answers, github.com is never contacted.
#
# Scoped to bats-core rather than all GitHub archives on purpose: a blanket
# /archive/ rule would route unmirrored dependencies through the mirror too,
# turning an honest 403 into a confusing 404.
rewrite github\.com/bats-core/bats-core/archive/(.*) storage.googleapis.com/bazel-mirror/github.com/bats-core/bats-core/archive/$1
rewrite github\.com/bats-core/bats-core/archive/(.*) github.com/bats-core/bats-core/archive/$1
